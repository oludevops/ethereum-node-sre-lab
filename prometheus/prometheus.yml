global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ['127.0.0.1:6060']
  - job_name: lighthouse
    scrape_timeout: 14s
    static_configs:
      - targets: ['127.0.0.1:5054']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
